[tool.poetry]
name = "affinis"
version = "0.7.2"
description = ""
authors = ["Rachael Sexton <rtbs@nist.gov>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
scipy = "^1.10"
sparse = "^0.15.4"
jaxtyping = "^0.3.3"
plum-dispatch = "^2.6.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.9.2"
seaborn = "^0.12.1"
black = "^23.3.0"
ruff = "^0.1"
pytest = "^8.3.3"
toolz = "^0.12.0"
hypothesis = "^6.151.5"

[tool.poetry.group.docs.dependencies]
pydlc = "^0.2"
# pygraphviz = "^1.11"
contingency = {git = "https://github.com/usnistgov/Contingency.git"}
netgraph = "^4.12.11"
pyvis = "^0.3.2"
jupyter-book = "^1.0.2"
sphinx-autodoc-typehints = "<2.4.0"
scikit-learn = "^1.2.0"
pandas = ">=1.5.3"
networkx = ">=3"
zensical = "^0.0.21"
mkdocstrings = {extras = ["python"], version = "^1.0.2"}


[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=associations,priors,beartype.beartype"


[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
