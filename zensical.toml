[project]

site_name = "Documentation"

site_description = "A new project generated from the default template project."
site_author = "<your name here>"
#site_url = "https://www.example.com/"

copyright = """
Copyright &copy; 2026 The authors
"""
nav = [
  {"Home" = "index.md"},  
  {"Installation" = "install.md"},
  { "User Guide" = [
        "using/assoc.md",
        "using/psdct.md"
    ]},
  {"Example" = "example.md"},

    # [
        # "getting-started/01-installation.md",
        # "getting-started/02-tutorial.md",
        # "getting-started/03-performance.md"
    # ]
  # },
  { "API" = [
        'api/associations.md',
        'api/priors.md',
        'api/types.md',
  ]},
]
# nav = [
#   { "Get started" = "index.md" },
#   { "Markdown in 5min" = "markdown.md" },
# ]
#extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mathjax.js"]

[project.theme]

#custom_dir = "overrides"
#favicon = "images/favicon.png"
language = "en"

features = [
    "announce.dismiss",
    #"content.action.edit",
    #"content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    #"navigation.instant.progress",
    "navigation.path",
    #"navigation.prune",
    "navigation.sections",
    #"navigation.tabs",
    #"navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    #"toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

#[project.theme.font]
#text = "Inter"
#code = "Jetbrains Mono"

#[project.theme.icon]
#logo = "lucide/smile"
#repo = "lucide/smile"

#[[project.extra.social]]
#icon = "fontawesome/brands/github"
#link = "https://github.com/user/repo"

[project.plugins.macros]
module_name = "docs/macros"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["affinis/"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
# show_source = false
# backlinks = "tree"
docstring_options = {ignore_init_summary = true}
docstring_section_style = "list"
# extensions = ["griffe_typingdoc",]
filters = ["!^_", "^__"]
heading_level = 1
# merge_init_into_class = true
parameter_headings = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = true
show_symbol_type_heading = true
show_symbol_type_toc = true
show_docstring_type_aliases = true
signature_crossrefs = true
summary = true
unwrap_annotated = true

