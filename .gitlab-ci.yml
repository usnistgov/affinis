stages:
  - build
  - deploy

test:
  stage: build
  image: python:3.11
  before_script:
    - pip install poetry
    - poetry install
    # - source `poetry env info --path`/bin/activate
    # - poetry run python -m ipykernel install --user --name affinis
  script:
    - poetry run pytest tests/

    # - jupyter-book clean manual
    # - jupyter-book build manual
  # artifacts:
  #   paths:
  #     - manual/_build/

pages:
  stage: deploy
  image: python:latest
  script:
    - pip install zensical
    - zensical build --clean
  pages:
    publish: public
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
