# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: "Library Reference: Affinis"
author: Dr. Rachael Sexton
logo: logo.png

only_build_toc_files: true
# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: auto

# Define the name of the latex output file for PDF builds
latex:
  latex_engine: tectonic
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/usnistgov/affinis  # Online location of your book
  path_to_book: manual # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

sphinx:
  extra_extensions:
  - 'sphinx.ext.autodoc'
  - 'sphinx.ext.napoleon'
  - 'sphinx.ext.viewcode'
  # - 'sphinx_autodoc_typehints'
  config: 
    add_module_names: false
    # napoleon_use_param: true
    # napoleon_preprocess_types: true 
    autodoc_type_aliases: 
      FeatMat: 'FeatMat'
      SimsMat: 'SimsMat'
      PsdCts: 'PsdCts'
      Elemwise: 'Elemwise'
      ElemwiseReduceFunc: 'ElemwiseReduceFunc'
    autodoc_typehints: 'description'
    python_use_unqualified_type_names: true
    latex_toplevel_sectioning: 'section'
    nb_render_image_options:
      scale: 50
    html_theme_options: 
      # use_issues_button: true
      # use_repository_button: true
      home_page_in_toc: true
      navbar_center:
        - "header.html"
      footer_start:
        - "footer.html"
      extra_footer: |
        <p><em>
        This material is declared a work of the U.S. Government and is not subject to copyright protection in the United States.
        </em></p>
        <p><em>
        Approved for public release; distribution is unlimited.
        </em></p>
      logo:
        image_light: logo.png
        image_dark: logo-dark.png
    html_show_copyright: false
    templates_path: "_templates"
    html_css_files:
      - "nist-combined.css"
    #   - "https://pages.nist.gov/nist-header-footer/css/nist-combined.css"
    # html_js_files:
    #   - "https://pages.nist.gov/nist-header-footer/js/nist-header-footer-v-2.0.js"
parse:
  myst_enable_extensions: 
    - dollarmath
